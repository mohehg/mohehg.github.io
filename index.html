<!DOCTYPE html>
<html lang="nl">
<head>
    <meta charset="UTF-8">
    <title>Hoe bouw je een website? PWS 4 MAVO</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    
    <button id="githubRedirectBtn" class="redirect-btn">Volgende stap</button>

<div style="text-align: center;">
<h1 id="pageText" class="vloeiend-verschijnen"><b>Website bouwen, hoe doe je dat precies?<b/></h1>
<p id="pageText" class="vloeiend-verschijnen">Gemaakt door Mohammed El Ghalib en Julian Jungheim 4 MAVO PWS</p>
</div>
    
<div style="text-align: center;">
    <img src="https://static0.howtogeekimages.com/wordpress/wp-content/uploads/2022/10/shutterstock_577183882.jpg" 
     alt="Code" 
     class="vloeiend-verschijnen"
     style="width: 850px; height: auto;">
</div>

    <script>

        const githubButton = document.getElementById('githubRedirectBtn');

        githubButton.addEventListener('click', function() {

        document.body.classList.add('fade-out');

        setTimeout(function() {

        window.location.href = 'redirect.html';

            }, 1000);

        });

    </script>

    <script>
    window.addEventListener('pageshow', function() {
        document.body.classList.remove('fade-out');
    });
</script>

</body>
</html>
