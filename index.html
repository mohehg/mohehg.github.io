<!DOCTYPE html>
<html lang="nl">
<head>
    <meta charset="UTF-8">
    <title>Hoe bouw je een website? PWS 4 MAVO</title>
    <link rel="stylesheet" href="style.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Valley+Sans:ital,wght@0,100..900;1,100..900&display=swap" rel="stylesheet">

</head>
<body>

<div class="custom-cursor">&lt;&gt;</div>
    <nav class="navigatiebalk">
    <a href="index.html">Introductie</a>
    <a href="hoofdvraag.html">Hoofdvraag</a>
    <a href="deelvraag1.html">Deelvraag 1</a>
    <a href="deelvraag2.html">Deelvraag 2</a>
    <a href="deelvraag3.html">Deelvraag 3</a>
    <a href="einde.html">Einde</a>
</nav>
    
    <button id="githubRedirectBtn" class="redirect-btn">Volgende</button>

    <div style="text-align: center;">
<h1 id="pageText" class="vloeiend-verschijnen"><b>Website bouwen, hoe doe je dat precies?<b/></h1>
<p id="pageText" class="vloeiend-verschijnen">Gemaakt door Mohammed El Ghalib en Julian Jungheim 4 MAVO PWS</p>
    </div>

    <script>

        const githubButton = document.getElementById('githubRedirectBtn');

        githubButton.addEventListener('click', function() {

        document.body.classList.add('fade-out');

        setTimeout(function() {

        window.location.href = 'hoofdvraag.html';

            }, 1000);

        });

    </script>

    <script>
    window.addEventListener('pageshow', function() {
        document.body.classList.remove('fade-out');
    });
</script>

<script>

    const huidigePagina = window.location.pathname.split("/").pop();

    const navigatieLinks = document.querySelectorAll(".navigatiebalk a");

    navigatieLinks.forEach(function(link) {

        const linkPagina = link.getAttribute("href");

        if (linkPagina === huidigePagina) {
            link.classList.add("actieve-pagina");
        }

    });

</script>

<script>
const cursor = document.querySelector(".custom-cursor");

document.addEventListener("mousemove", function(event) {
    cursor.style.left = event.clientX + "px";
    cursor.style.top = event.clientY + "px";
});
</script>

<script>
document.addEventListener("click", function(event) {

    for (let i = 0; i < 5; i++) {

        const line = document.createElement("span");

        line.classList.add("click-line");

        line.style.left = event.clientX + "px";
        line.style.top = event.clientY + "px";

        line.style.setProperty("--angle", (i * 72) + "deg");

        document.body.appendChild(line);

        setTimeout(function() {
            line.remove();
        }, 500);
    }

});
</script>

</body>
</html>
