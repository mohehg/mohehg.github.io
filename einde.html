<!DOCTYPE html>
<html lang="nl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <link rel="stylesheet" href="style.css">
</head>
<body>

    <nav class="navigatiebalk">
    <a href="index.html">Introductie</a>
    <a href="hoofdvraag.html">Hoofdvraag</a>
    <a href="deelvraag1.html">Deelvraag 1</a>
    <a href="deelvraag2.html">Deelvraag 2</a>
    <a href="deelvraag3.html">Deelvraag 3</a>
    <a href="einde.html">Einde</a>
</nav>

    <button class="redirect-btn" onclick="window.history.back();">Vorige</button>

    <div style="text-align: center;">
        <h6 id="pageText" class="vloeiend-verschijnen"><b>Dit was het einde! U kunt gerust de website nog een keer bezoeken via deze link: mohehg.github.io.</b></h6>
        <p id="pageText" class="vloeiend-verschijnen"><b>U kunt ook gerust weer door de website scrollen of foto's maken!</b></p>
    </div>

    <script>
    window.addEventListener('pageshow', function() {
        document.body.classList.remove('fade-out');
    });
</script>

<script>

    const huidigePagina = window.location.pathname.split("/").pop();

    const navigatieLinks = document.querySelectorAll(".navigatiebalk a");

    navigatieLinks.forEach(function(link) {

        const linkPagina = link.getAttribute("href");

        if (linkPagina === huidigePagina) {
            link.classList.add("actieve-pagina");
        }

    });

</script>

</body>
</html>
