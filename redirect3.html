<!DOCTYPE html>
<html lang="nl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Website maken: deelvraag 2</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <button id="githubRedirectBtn" class="redirect-btn">Volgende stap</button>
    <button class="redirect-btn" onclick="window.history.back();">Vorige stap</button>

    <div style="text-align: center;">
        <h4 id="pageText" class="vloeiend-verschijnen"><b>Deelvraag 2: Hoe bepaal je de doelgroep van je website en hoe moet je website eruitzien als je je doelgroep hebt gekozen?</b></h4>
    </div>

    <script>

    const githubButton = document.getElementById('githubRedirectBtn');

    githubButton.addEventListener('click', function() {

    document.body.classList.add('fade-out');

    setTimeout(function() {

    window.location.href = 'redirect4.html';

        }, 1000);

    });

</script>

<script>
    window.addEventListener('pageshow', function() {
        document.body.classList.remove('fade-out');
    });
</script>

</body>
